[project]
name = "pm-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for PM Assistant — local-first AI copilot for project managers."
readme = "../README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PM Assistant contributors" }]
keywords = ["mcp", "openrouter", "smithery", "fastapi", "agent", "project-management"]
dependencies = [
    "aiogram>=3.15",
    "aiosqlite>=0.20",
    "apscheduler>=3.10",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=1.60",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.22",
    "sse-starlette>=2.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

